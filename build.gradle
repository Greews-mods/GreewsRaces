plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'maven-publish'
}

group = project.maven_group

// === VERZOVÁNÍ ===
// mod_version = 1.1.0
// minecraft_version = 1.21.10
version = "${project.mod_version}+${project.minecraft_version}"

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // TerraBlender for 1.20.1 (Modrinth version id J1S3aA8i = 3.0.1.10 Fabric)
    modImplementation "maven.modrinth:kkmrDlKT:J1S3aA8i"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

def mcBuildsRoot = file('C:/Users/farda/Desktop/MC builds/GreewsRaces')

tasks.register('copyToMcBuilds', Copy) {
    dependsOn remapJar
    def outJar = layout.buildDirectory.file("libs/${archives_base_name}-${version}.jar").get().asFile
    from outJar
    into file("${mcBuildsRoot}/${minecraft_version}")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

build.finalizedBy copyToMcBuilds